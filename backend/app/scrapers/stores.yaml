# Stores scraped by the background pipeline.
# platform: shopify -> uses /products.json (fast, structured)
# platform: html    -> generic Scrapling CSS-selector adapter (see html_generic.py)
# verticals: what the store sells; used as a hint when categorising products.
stores:
  # ---------------- Fashion ----------------
  - {slug: outfitters, name: Outfitters, website: "https://outfitters.com.pk", verticals: [fashion]}
  - {slug: breakout, name: Breakout, website: "https://breakout.com.pk", verticals: [fashion]}
  - {slug: limelight, name: Limelight, website: "https://www.limelight.pk", verticals: [fashion], default_gender: women}
  - {slug: bonanza-satrangi, name: Bonanza Satrangi, website: "https://bonanzasatrangi.com", verticals: [fashion]}
  - {slug: gul-ahmed, name: Gul Ahmed, website: "https://www.gulahmedshop.com", verticals: [fashion, home]}
  - {slug: junaid-jamshed, name: J., website: "https://www.junaidjamshed.com", verticals: [fashion, beauty]}
  - {slug: alkaram, name: Alkaram Studio, website: "https://www.alkaramstudio.com", verticals: [fashion, home]}
  - {slug: nishat-linen, name: Nishat Linen, website: "https://nishatlinen.com", verticals: [fashion, home]}
  - {slug: generation, name: Generation, website: "https://generation.com.pk", verticals: [fashion]}
  - {slug: engine, name: Engine, website: "https://engine.com.pk", verticals: [fashion]}
  - {slug: ethnc, name: Ethnc, website: "https://pk.ethnc.com", verticals: [fashion]}
  - {slug: zellbury, name: Zellbury, website: "https://zellbury.com", verticals: [fashion]}
  - {slug: beechtree, name: Beechtree, website: "https://beechtree.pk", verticals: [fashion], default_gender: women}
  - {slug: maria-b, name: Maria B, website: "https://www.mariab.pk", verticals: [fashion], default_gender: women}
  - {slug: almirah, name: Almirah, website: "https://www.almirah.com.pk", verticals: [fashion]}
  # ---------------- Footwear ----------------
  - {slug: servis, name: Servis, website: "https://www.servis.pk", verticals: [fashion]}
  - {slug: ndure, name: Ndure, website: "https://www.ndure.com", verticals: [fashion]}
  - {slug: borjan, name: Borjan, website: "https://www.borjan.com.pk", verticals: [fashion]}
  - {slug: stylo, name: Stylo, website: "https://stylo.pk", verticals: [fashion], default_gender: women}
  # ---------------- Electronics ----------------
  # Telemart reports all stock as unavailable to stealth-header clients; plain HTTP gets real stock.
  - {slug: telemart, name: Telemart, website: "https://www.telemart.pk", verticals: [electronics, home, beauty, fashion], fetcher: httpx}
  - {slug: vmart, name: Vmart, website: "https://www.vmart.pk", verticals: [electronics]}
  - {slug: audionic, name: Audionic, website: "https://www.audionic.co", verticals: [electronics]}
  - {slug: ronin, name: Ronin, website: "https://www.ronin.pk", verticals: [electronics]}
  # ---------------- Beauty ----------------
  - {slug: saeed-ghani, name: Saeed Ghani, website: "https://www.saeedghani.pk", verticals: [beauty]}
  - {slug: highfy, name: Highfy, website: "https://www.highfy.pk", verticals: [beauty]}

  # Example non-Shopify store using the generic HTML adapter (disabled by default;
  # verify selectors against the live site before enabling).
  - slug: example-html-store
    name: Example HTML Store
    website: "https://example.com"
    platform: html
    enabled: false
    verticals: [fashion]
    fetcher: dynamic
    listing_urls: ["https://example.com/collections/sale"]
    selectors:
      item: ".product-tile"
      title: ".product-name::text"
      url: "a::attr(href)"
      price: ".price .sales::text"
      original_price: ".price .strike::text"
      image: "img::attr(src)"
      next_page: "a.next::attr(href)"
